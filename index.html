<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Frontiers of Science Survey</title>
  <link rel="stylesheet" href="lib/study-kit.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    #top {
      flex: none;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    #top .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #top .part { margin-left: auto; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    #bar { flex: none; height: 4px; background: var(--border); }
    #bar > div { height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
    #main { flex: 1 1 auto; position: relative; display: flex; flex-direction: column; }
    #frame { flex: 1 1 auto; width: 100%; border: 0; display: none; background: var(--bg); }
    #screen { flex: 1 1 auto; }
    .checks { margin: 20px 0 0; display: flex; flex-direction: column; gap: 8px; }
    .code { font: 700 1.6rem/1.2 ui-monospace, Menlo, monospace; letter-spacing: .08em; padding: 12px; text-align: center;
            border: 1px dashed var(--border); border-radius: 10px; margin: 12px 0; }
    .save-status { margin-top: 16px; font-size: .9rem; }
    .save-status.bad { color: var(--danger); }
    .save-status.good { color: var(--ok); }

    /* Debug panel */
    #debug { position: fixed; right: 8px; bottom: 8px; z-index: 50; max-width: min(360px, calc(100vw - 16px));
             background: #fff4c2; color: #4a3b00; border: 1px solid #e6d27a; border-radius: 10px;
             font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
    #debug summary { padding: 6px 10px; cursor: pointer; font-weight: 700; }
    #debug .body { padding: 0 10px 10px; max-height: 60vh; overflow: auto; }
    #debug table { border-collapse: collapse; width: 100%; }
    #debug td { padding: 3px 4px; border-top: 1px solid #e6d27a; vertical-align: middle; }
    #debug button, #debug select { font: inherit; }
    #debug pre { white-space: pre-wrap; word-break: break-all; margin: 6px 0 0; max-height: 160px; overflow: auto; }
  </style>
</head>
<body>
  <header id="top"><span class="title"></span><span class="part"></span></header>
  <div id="bar"><div></div></div>
  <main id="main">
    <div id="screen"></div>
    <iframe id="frame" title="Survey part" allow="autoplay; fullscreen"></iframe>
  </main>
  <noscript><div class="sk-wrap"><div class="sk-card">This survey needs JavaScript turned on.</div></div></noscript>

  <script src="config.js"></script>
  <script src="lib/wrapper.js"></script>
</body>
</html>
