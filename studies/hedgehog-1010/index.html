<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Classmate chat</title>
  <link rel="stylesheet" href="../../lib/study-kit.css">
  <style>
    .chat { display: flex; flex-direction: column; gap: 10px; }
    .chat-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
              display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
    .chat-head .who { font-weight: 600; line-height: 1.2; }
    .chat-head .who small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
    .chat-head .count { margin-left: auto; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
    .msgs { display: flex; flex-direction: column; gap: 8px; min-height: 200px; }
    .msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
    .msg.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 4px; }
    .msg.note { align-self: center; max-width: 100%; background: none; color: var(--muted); font-size: .88rem; text-align: center; padding: 4px 8px; }
    .typing { display: inline-flex; gap: 4px; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .4; animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: .9; } }
    .composer { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .composer textarea { flex: 1; min-height: 46px; max-height: 160px; resize: none; font: inherit; padding: 11px 14px;
                         border: 1px solid var(--border); border-radius: 22px; background: var(--surface); color: var(--text); }
    .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .composer .sk-btn { padding: 10px 18px; min-height: 46px; }
  </style>
</head>
<body>
<script src="../../config.js"></script>
<script src="../../lib/study-kit.js"></script>
<script>
/*
 * Hedgehog Team — Wed 10:10
 * Question:  Do people shift their writing style toward the style of the person they're chatting with?
 * Design:    Between subjects. An AI "classmate" (Jordan) chats in a CASUAL or FORMAL style; content is held
 *            constant (same fixed opening question, same 3 follow-up topics, same persona, matched length).
 *            A neutral before-sample of the participant's writing is taken first, in the same text box.
 * Measures:  (offline) style of the participant's 4 messages vs. their before-sample: length, capitals,
 *            punctuation, emoji, slang, contractions, style-matching score. (here) ratings of the chat partner,
 *            a manipulation check (how casual/formal was Jordan?), and self-reported adjustment.
 * Tech:      Live replies come from the Apps Script chat proxy (gas/Chat.gs, Claude Haiku). If there's no
 *            endpoint/API key, or a reply takes >12 s, a pre-written reply in the same style is used instead.
 *            Every bot message records which source it came from.
 */
(async () => {
  const STUDY = 'hedgehog-1010';
  const kit = await StudyKit.start({ id: STUDY, conditions: ['casual', 'formal'] });
  const cfg = window.MEGASURVEY_CONFIG || {};
  const style = kit.condition;
  const esc = StudyKit.esc;

  // ---------- fixed text for each style ----------
  const OPENER = {
    casual: 'hey!! im jordan 👋 its my first day in this class too lol. what are you majoring in, or thinking about majoring in?',
    formal: 'Hello, I am Jordan. It is my first day in this class as well. What are you majoring in, or thinking of majoring in?',
  };
  const FALLBACK = {
    casual: [null,
      'oh nice, thats a solid pick ngl! im stuck between econ and enviro sci lol. what other classes are you taking this semester?',
      'ok thats lowkey a good lineup! im doing stats and spanish rn. what do you like to do for fun outside of class?',
      'wait thats fun fr! i mostly cook and run by the river lol. got a favorite spot around campus you would recommend? food, studying, anything',
      'ooh ok im def checking that out!! oh wait the professor just walked in lol, nice meeting you 😊',
    ],
    formal: [null,
      'That is a good choice. I am deciding between economics and environmental science myself. What other classes are you taking this semester?',
      'That sounds like a strong schedule. I am taking statistics and Spanish. What do you like to do for fun outside of class?',
      'That sounds enjoyable. I mostly cook and run along the river. Do you have a favorite spot on or around campus that you would recommend?',
      'Thank you for the recommendation; I will certainly try it. It appears the professor has just arrived. It was very nice to meet you.',
    ],
  };
  const N_TURNS = 4;
  const TIMEOUT_MS = 12000;
  const MIN_TYPING_MS = 1400;   // same minimum "typing…" time for live and fallback replies

  // ---------- chat UI ----------
  function mountChat(title, subtitle) {
    const root = kit.stage('');
    root.className = 'sk-card chat';
    root.style.minHeight = '0';
    root.innerHTML = `
      <div class="chat-head">${title ? `<div class="avatar">J</div><div class="who">${esc(title)}<small>${esc(subtitle)}</small></div>` : `<div class="who">${esc(subtitle)}</div>`}
        <span class="count"></span></div>
      <div class="msgs" aria-live="polite"></div>
      <form class="composer"><textarea rows="1" disabled placeholder="Type a message…" aria-label="Your message" maxlength="600"></textarea>
        <button class="sk-btn" type="submit" disabled>Send</button></form>`;
    kit.el.style.paddingBottom = '16px';
    return {
      root,
      msgs: root.querySelector('.msgs'),
      form: root.querySelector('form'),
      ta: root.querySelector('textarea'),
      btn: root.querySelector('button'),
      count: root.querySelector('.count'),
    };
  }
  function addMsg(ui, cls, html) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.innerHTML = html;
    ui.msgs.appendChild(d);
    ui.form.scrollIntoView({ block: 'end' });
    return d;
  }

  /** Wait for the participant to send one message; returns it plus typing metrics. */
  function compose(ui) {
    return new Promise(resolve => {
      const ta = ui.ta, btn = ui.btn;
      const shownAt = performance.now();
      let firstKey = null, keys = 0, dels = 0, pastes = 0;
      ta.disabled = false; ta.value = ''; ta.style.height = '';
      const touch = matchMedia('(pointer: coarse)').matches;
      if (!touch) ta.focus();
      const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; btn.disabled = !ta.value.trim(); };
      const onKey = e => {
        if (firstKey == null) firstKey = performance.now();
        keys++;
        if (e.key === 'Backspace' || e.key === 'Delete') dels++;
        if (e.key === 'Enter' && !e.shiftKey && !touch) { e.preventDefault(); send(); }
      };
      const onPaste = () => { pastes++; };
      const send = () => {
        const text = ta.value.trim();
        if (!text) return;
        ta.removeEventListener('keydown', onKey); ta.removeEventListener('input', grow); ta.removeEventListener('paste', onPaste);
        ui.form.onsubmit = null;
        ta.disabled = true; btn.disabled = true; ta.value = ''; ta.style.height = '';
        const t = performance.now();
        resolve({ text, compose_ms: Math.round(t - shownAt), first_key_ms: firstKey == null ? null : Math.round(firstKey - shownAt),
                  keys, deletions: dels, pastes, at_ms: kit.elapsed() });
      };
      ta.addEventListener('keydown', onKey); ta.addEventListener('input', grow); ta.addEventListener('paste', onPaste);
      ui.form.onsubmit = e => { e.preventDefault(); send(); };
      grow();
    });
  }

  async function botReply(turn, transcript) {
    const t0 = performance.now();
    let out = { source: 'fallback', text: FALLBACK[style][turn] };
    if (cfg.endpoint) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
      try {
        const res = await fetch(cfg.endpoint, {
          method: 'POST', signal: ctrl.signal,
          body: JSON.stringify({ action: 'chat', study_id: STUDY, condition: style, pid: kit.pid, turn,
                                 transcript: transcript.map(m => ({ role: m.role, text: m.text })) }),
        });
        const j = await res.json();
        if (j.ok && j.text) out = { source: 'live', text: j.text, model: j.model, usage: j.usage, api_ms: j.ms };
        else out.error = j.error || 'no text';
      } catch (e) {
        out.error = e.name === 'AbortError' ? 'timeout' : String(e.message || e);
      } finally { clearTimeout(timer); }
    } else {
      out.error = 'no endpoint';
    }
    const waited = performance.now() - t0;
    if (waited < MIN_TYPING_MS) await kit.wait(MIN_TYPING_MS - waited + Math.round(kit.random() * 600));
    out.latency_ms = Math.round(performance.now() - t0);
    return out;
  }

  // ---------- 1. before-sample (same text box, no chat partner yet) ----------
  await kit.show({
    title: 'A quick chat',
    html: `<p>In this part you’ll have a short text chat. First, a warm-up question.</p>`,
    button: 'Start',
  });
  const pre = mountChat(null, 'Warm-up');
  addMsg(pre, 'note', 'In a sentence or two: what did you do last weekend?');
  const baseline = await compose(pre);
  addMsg(pre, 'user', esc(baseline.text));
  kit.set('baseline', baseline.text);
  kit.set('baseline_meta', baseline);
  await kit.wait(500);

  // ---------- 2. setup ----------
  await kit.show({
    title: 'First day of class',
    html: `<p>Imagine it’s the first day of a new class. You sit down next to another student, <strong>Jordan</strong>,
      and start chatting before class begins.</p>
      <p>Jordan is an <strong>AI chatbot</strong> playing a fellow student. You’ll send <strong>${N_TURNS} messages</strong>.
      Just reply however you naturally would.</p>
      <p class="sk-muted">Please don’t share personal details like your full name, email or phone number.</p>`,
    button: 'Start chatting',
  });

  // ---------- 3. chat ----------
  const ui = mountChat('Jordan', 'Classmate · AI chatbot');
  const transcript = [];
  const say = m => { transcript.push(m); addMsg(ui, m.role, esc(m.text)); };
  kit.mark('chat_start');

  // Opening message: fixed, same for everyone in a condition.
  {
    const typing = addMsg(ui, 'bot', '<span class="typing"><i></i><i></i><i></i></span>');
    await kit.wait(MIN_TYPING_MS);
    typing.remove();
    say({ role: 'bot', text: OPENER[style], source: 'fixed', turn: 0, at_ms: kit.elapsed() });
  }
  for (let turn = 1; turn <= N_TURNS; turn++) {
    ui.count.textContent = `Message ${turn} of ${N_TURNS}`;
    const m = await compose(ui);
    say(Object.assign({ role: 'user', turn }, m));
    const typing = addMsg(ui, 'bot', '<span class="typing"><i></i><i></i><i></i></span>');
    const r = await botReply(turn, transcript);
    typing.remove();
    say(Object.assign({ role: 'bot', turn, at_ms: kit.elapsed() }, r));
  }
  ui.count.textContent = 'Chat finished';
  kit.mark('chat_end');
  ui.form.remove();
  const done = document.createElement('div');
  done.className = 'sk-actions';
  done.innerHTML = '<button class="sk-btn" type="button">Continue</button>';
  ui.root.appendChild(done);
  done.scrollIntoView({ block: 'end' });
  await new Promise(r => done.querySelector('button').addEventListener('click', r, { once: true }));

  // Save the chat: full transcript (JSON) + one column per message for easy reading in the Sheet.
  kit.set('transcript', transcript);
  transcript.forEach(m => { kit.set((m.role === 'bot' ? 'bot_msg' : 'user_msg') + m.turn, m.text); });
  kit.set('bot_sources', transcript.filter(m => m.role === 'bot').map(m => m.source).join(','));
  kit.set('live_replies', transcript.filter(m => m.source === 'live').length);

  // ---------- 4. ratings ----------
  const agree = ['Strongly disagree', 'Strongly agree'];
  await kit.ask({
    id: 'ratings',
    title: 'About your chat with Jordan',
    intro: '<p class="sk-muted">How much do you agree with each statement?</p>',
    questions: [
      { id: 'r_enjoy',    type: 'scale', min: 1, max: 5, labels: agree, prompt: 'I enjoyed the conversation.' },
      { id: 'r_natural',  type: 'scale', min: 1, max: 5, labels: agree, prompt: 'The conversation felt natural.' },
      { id: 'r_friendly', type: 'scale', min: 1, max: 5, labels: agree, prompt: 'Jordan was friendly.' },
      { id: 'r_gotme',    type: 'scale', min: 1, max: 5, labels: agree, prompt: 'Jordan seemed to understand me.' },
      { id: 'r_human',    type: 'scale', min: 1, max: 5, labels: agree, prompt: 'Jordan felt like a real student.' },
      { id: 'r_again',    type: 'scale', min: 1, max: 5, labels: agree, prompt: 'I would like to chat with Jordan again.' },
    ],
  });
  await kit.ask({
    id: 'checks',
    questions: [
      { id: 'mc_formality', type: 'scale', min: 1, max: 5, labels: ['Very formal', 'Very casual'], prompt: 'How formal or casual was the way Jordan wrote?' },
      { id: 'self_adjust', type: 'scale', min: 1, max: 5, labels: ['Not at all', 'A lot'], prompt: 'Did you change the way you wrote to match Jordan?' },
    ],
  });

  kit.finish();
})();
</script>
</body>
</html>
